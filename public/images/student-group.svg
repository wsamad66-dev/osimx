<svg width="420" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232D6E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26A5DE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="420" height="500" fill="url(#grad1)"/>
  
  <!-- Student silhouettes -->
  <g opacity="0.3">
    <!-- Student 1 -->
    <ellipse cx="140" cy="200" rx="30" ry="35" fill="#ffffff"/>
    <ellipse cx="140" cy="155" rx="20" ry="22" fill="#ffffff"/>
    
    <!-- Student 2 -->
    <ellipse cx="210" cy="220" rx="32" ry="37" fill="#ffffff"/>
    <ellipse cx="210" cy="172" rx="22" ry="24" fill="#ffffff"/>
    
    <!-- Student 3 -->
    <ellipse cx="280" cy="210" rx="30" ry="35" fill="#ffffff"/>
    <ellipse cx="280" cy="165" rx="20" ry="22" fill="#ffffff"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="350" cy="80" r="15" fill="#ffffff" opacity="0.2"/>
  <circle cx="80" cy="420" r="20" fill="#ffffff" opacity="0.15"/>
  <circle cx="380" cy="450" r="12" fill="#F29100" opacity="0.3"/>
  
  <!-- Text overlay -->
  <text x="210" y="320" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">
    Étudiants Africains
  </text>
  <text x="210" y="350" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.9">
    Succès à l'international
  </text>
  
  <!-- Graduation cap icon -->
  <g transform="translate(180, 380)">
    <rect x="0" y="15" width="60" height="4" fill="#ffffff" rx="2"/>
    <polygon points="30,0 0,15 60,15" fill="#ffffff"/>
    <circle cx="55" cy="10" r="3" fill="#F29100"/>
    <line x1="55" y1="13" x2="55" y2="25" stroke="#F29100" stroke-width="1"/>
  </g>
</svg>
